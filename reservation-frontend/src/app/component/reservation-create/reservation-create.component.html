<div class="create-page">
  <div class="create-card">
    <div class="create-card-header">
      <nav class="create-nav" aria-label="Navegación">
        <a routerLink="/" class="nav-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          Inicio
        </a>
        <a routerLink="/list" class="nav-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>
          Reservas
        </a>
      </nav>
      <h2 class="create-title">Nueva Reserva</h2>
      <p class="create-subtitle">Completa los datos para registrar una reserva</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="create-form">
      <div class="field">
        <label for="nombreCliente" class="field-label">Nombre del cliente</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input id="nombreCliente" formControlName="nombreCliente" placeholder="Ej. Juan Pérez" />
        </div>
        <div class="error" *ngIf="form.get('nombreCliente')?.touched && form.get('nombreCliente')?.invalid">
          El nombre del cliente es obligatorio
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="fecha" class="field-label">Fecha</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <input id="fecha" type="date" formControlName="fecha" />
          </div>
          <div class="error" *ngIf="form.get('fecha')?.touched && form.get('fecha')?.invalid">
            La fecha es obligatoria
          </div>
        </div>

        <div class="field">
          <label for="hora" class="field-label">Hora</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <input id="hora" type="time" formControlName="hora" />
          </div>
          <div class="error" *ngIf="form.get('hora')?.touched && form.get('hora')?.invalid">
            La hora es obligatoria
          </div>
        </div>
      </div>

      <div class="field">
        <label for="servicio" class="field-label">Servicio</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          <select id="servicio" formControlName="servicio">
            <option value="" disabled>Seleccione un servicio</option>
            <option *ngFor="let s of services" [value]="s">{{ s }}</option>
          </select>
        </div>
        <div class="error" *ngIf="form.get('servicio')?.touched && form.get('servicio')?.invalid">
          Debes seleccionar un servicio
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-submit" [disabled]="submitting">
          <svg *ngIf="!submitting" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          <div *ngIf="submitting" class="btn-spinner"></div>
          {{ submitting ? 'Creando reserva…' : 'Crear reserva' }}
        </button>
      </div>
    </form>
  </div>
</div>
