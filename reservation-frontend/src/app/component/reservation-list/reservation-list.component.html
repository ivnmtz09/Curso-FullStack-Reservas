<div class="list-page">
  <div class="list-header">
    <div class="list-header-left">
      <h2 class="list-title">Reservas</h2>
      <p class="list-subtitle" *ngIf="!loading()">{{ reservations().length }} reserva(s) registrada(s)</p>
    </div>
    <nav class="list-nav" aria-label="Navegación">
      <a routerLink="/" class="nav-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        Inicio
      </a>
      <a routerLink="/create" class="nav-link nav-link-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nueva reserva
      </a>
    </nav>
  </div>

  <div *ngIf="loading()" class="loading-state">
    <div class="loading-spinner"></div>
    <span>Cargando reservas…</span>
  </div>

  <div *ngIf="!loading() && reservations().length > 0" class="table-wrapper">
    <table class="reservations-table" aria-label="Tabla de reservas">
      <thead>
        <tr>
          <th>ID</th>
          <th>Cliente</th>
          <th>Fecha</th>
          <th>Hora</th>
          <th>Servicio</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of reservations()" class="table-row">
          <td data-label="ID"><span class="id-badge">#{{ r.id }}</span></td>
          <td data-label="Cliente">{{ r.customerName }}</td>
          <td data-label="Fecha">{{ r.date }}</td>
          <td data-label="Hora">{{ r.time }}</td>
          <td data-label="Servicio"><span class="service-tag">{{ r.service }}</span></td>
          <td data-label="Acciones">
            <button
              class="btn-cancel"
              (click)="cancel(r.id)"
              [disabled]="isCancelling(r.id)"
              aria-label="Cancelar reserva {{ r.id }}"
            >
              <svg *ngIf="!isCancelling(r.id)" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
              {{ isCancelling(r.id) ? 'Cancelando…' : 'Cancelar' }}
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="!loading() && reservations().length === 0" class="empty-state">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
    <p>No hay reservas registradas.</p>
    <a routerLink="/create" class="nav-link nav-link-primary">Crear primera reserva</a>
  </div>
</div>
